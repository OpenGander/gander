[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengander-mcp"
version = "0.1.0"
description = "FastMCP server for OpenGander Analytics - query ClickHouse data via MCP tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "OpenGander", email = "dev@opengander.com" }
]
keywords = ["mcp", "analytics", "clickhouse", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.14",
    "clickhouse-connect>=0.8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30.0",
    "PyJWT[crypto]>=2.8.0",  # JWT validation with RS256
    "httpx>=0.27.0",          # Async HTTP for JWKS fetch
    "cachetools>=5.3.0",      # JWKS caching
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.12",
    "time-machine>=2.13",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "cryptography>=42.0",
]

[project.scripts]
opengander-mcp = "opengander_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengander_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/opengander_mcp --cov-report=term-missing"
